<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reset Password - Bridges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#0B0718;color:#F0ECF8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.container{max-width:420px;width:100%;padding:40px 32px;background:#130F24;border-radius:20px;border:1px solid #2A2148}
.logo-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px}
.logo-text{font-size:20px;font-weight:700;color:#9B7DFF}
h1{font-size:22px;font-weight:800;margin-bottom:8px;color:#F0ECF8}
.subtitle{font-size:14px;color:#9B93B8;line-height:1.5;margin-bottom:28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;color:#9B93B8;margin-bottom:6px}
input[type="email"],input[type="password"]{
  width:100%;background:#151028;border:1.5px solid #2A2148;border-radius:12px;
  padding:13px 16px;font-size:15px;font-family:'Nunito',sans-serif;color:#F0ECF8;
  outline:none;transition:border-color .2s;
}
input[type="email"]:focus,input[type="password"]:focus{border-color:#9B7DFF}
input::placeholder{color:#3A2A58}
.btn{
  width:100%;background:#9B7DFF;color:#fff;border:none;border-radius:12px;
  padding:15px;font-size:16px;font-weight:700;font-family:'Nunito',sans-serif;
  cursor:pointer;margin-top:8px;transition:opacity .2s;
}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.error-box{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.25);border-radius:10px;padding:12px 14px;font-size:13px;color:#FF6B78;margin-bottom:16px;display:none}
.success-box{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);border-radius:10px;padding:12px 14px;font-size:13px;color:#4ADE80;margin-bottom:16px;display:none}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#5E5580}
.back-link a{color:#9B7DFF;text-decoration:none;font-weight:700}
.success-screen{text-align:center;display:none}
.success-screen .check{font-size:48px;margin-bottom:16px}
.success-screen h2{font-size:22px;font-weight:800;color:#4ADE80;margin-bottom:10px}
.success-screen p{font-size:14px;color:#9B93B8;line-height:1.6}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="logo-row">
    <svg width="28" height="28" viewBox="0 0 100 100" fill="none"><path d="M20 70 Q50 20 80 70" stroke="#9B7DFF" stroke-width="6" fill="none"/><path d="M30 70 Q50 30 70 70" stroke="#B9A4FF" stroke-width="4" fill="none"/></svg>
    <span class="logo-text">Bridges</span>
  </div>
  <div id="loading" style="text-align:center;color:#5E5580;padding:20px 0">Loading...</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function renderRequestForm() {
  document.getElementById('app').innerHTML = `
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none"><path d="M20 70 Q50 20 80 70" stroke="#9B7DFF" stroke-width="6" fill="none"/><path d="M30 70 Q50 30 70 70" stroke="#B9A4FF" stroke-width="4" fill="none"/></svg>
      <span class="logo-text">Bridges</span>
    </div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <button class="btn" id="submitBtn" onclick="submitRequest()">Send reset link</button>
    <span class="back-link"><a href="javascript:history.back()">Back to app</a></span>
  `;
}

function renderResetForm() {
  document.getElementById('app').innerHTML = `
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none"><path d="M20 70 Q50 20 80 70" stroke="#9B7DFF" stroke-width="6" fill="none"/><path d="M30 70 Q50 30 70 70" stroke="#B9A4FF" stroke-width="4" fill="none"/></svg>
      <span class="logo-text">Bridges</span>
    </div>
    <h1>Set new password</h1>
    <p class="subtitle">Choose a strong password for your Bridges account.</p>
    <div class="error-box" id="errorBox"></div>
    <div class="form-group">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" />
    </div>
    <button class="btn" id="submitBtn" onclick="submitReset()">Update password</button>
  `;
}

function renderSuccess(message) {
  document.getElementById('app').innerHTML = `
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none"><path d="M20 70 Q50 20 80 70" stroke="#9B7DFF" stroke-width="6" fill="none"/><path d="M30 70 Q50 30 70 70" stroke="#B9A4FF" stroke-width="4" fill="none"/></svg>
      <span class="logo-text">Bridges</span>
    </div>
    <div class="success-screen" style="display:block">
      <div class="check">&#10003;</div>
      <h2>${message.title}</h2>
      <p>${message.body}</p>
      <button class="btn" style="margin-top:28px" onclick="window.location.href='/reset-password'">Done</button>
    </div>
  `;
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  if (box) { box.textContent = msg; box.style.display = 'block'; }
}

function hideError() {
  const box = document.getElementById('errorBox');
  if (box) box.style.display = 'none';
}

async function submitRequest() {
  hideError();
  const email = document.getElementById('email').value.trim();
  if (!email) { showError('Please enter your email address.'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    // Always show success to prevent user enumeration
    renderSuccess({
      title: 'Check your email',
      body: 'If that email is registered, you\'ll receive a reset link shortly. Check your spam folder if you don\'t see it within a few minutes.',
    });
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Send reset link';
    showError('Something went wrong. Please try again.');
  }
}

async function submitReset() {
  hideError();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (!newPassword || newPassword.length < 6) {
    showError('Password must be at least 6 characters.'); return;
  }
  if (newPassword !== confirmPassword) {
    showError('Passwords do not match.'); return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Updating...';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = 'Update password';
      showError(data.message || 'Something went wrong. Please try again.');
      return;
    }
    renderSuccess({
      title: 'Password updated',
      body: 'Your password has been changed. You can now sign in to the Bridges app with your new password.',
    });
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Update password';
    showError('Something went wrong. Please try again.');
  }
}

// On load, show the appropriate form
if (token) {
  renderResetForm();
} else {
  renderRequestForm();
}
</script>
</body>
</html>
